[build-system]
build-backend = "flit_gettext.scm"
requires = [ "flit-gettext[scm]", "wheel" ]

[project]
name = "django-mail-auth"
readme = "README.md"
keywords = [
  "authentication",
  "django",
  "email",
  "otp",
  "passwordless",
]
license = { file = "LICENSE" }
authors = [
  { name = "Johannes Maron", email = "johannes@maron.family" },
]
requires-python = ">=3.14"
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Environment :: Console",
  "Framework :: Django",
  "Framework :: Django :: 5.2",
  "Framework :: Django :: 6.0",
  "Framework :: Django :: 6.1",
  "Framework :: Wagtail",
  "Framework :: Wagtail :: 6",
  "Framework :: Wagtail :: 7",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.14",
  "Programming Language :: Python :: 3.15",
  "Topic :: Internet",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Quality Assurance",
  "Topic :: Software Development :: Testing",
]
dynamic = [ "description", "version" ]
dependencies = [ "django>=5.2.13" ]
optional-dependencies.postgres = [
  "django-citext",
  "psycopg",
]
optional-dependencies.wagtail = [
  "wagtail>=7.3.1",
]
urls.Changelog = "https://github.com/codingjoe/django-mail-auth/releases"
urls.Documentation = "https://django-mail-auth.rtfd.io/"
urls.Funding = "https://github.com/sponsors/codingjoe"
# https://packaging.python.org/en/latest/specifications/well-known-project-urls/#well-known-labels
urls.Homepage = "https://github.com/codingjoe/django-mail-auth"
urls.Issues = "https://github.com/codingjoe/django-mail-auth/issues"
urls.Releasenotes = "https://github.com/codingjoe/django-mail-auth/releases/latest"
urls.Source = "https://github.com/codingjoe/django-mail-auth"

[dependency-groups]
dev = [
  { include-group = "test" },
  { include-group = "docs" },
]
test = [
  "pytest",
  "pytest-cov",
  "pytest-django",
]
docs = [
  "markdown-callouts",
  "mkdocs",
  "mkdocs-material",
  "mkdocstrings[python]>=1.0.3",
  "pygments",
]

[tool.setuptools_scm]
write_to = "mailauth/_version.py"

[tool.flit]
module.name = "mailauth"

[tool.ruff]
line-length = 88
indent-width = 4
src = [ "mailauth", "tests" ]
format.preview = true
format.indent-style = "space"
format.quote-style = "double"
format.line-ending = "auto"
format.skip-magic-trailing-comma = false
lint.select = [
  "D",   # pydocstyle
  "E",   # pycodestyle errors
  "EXE", # flake8-executable
  "F",   # pyflakes
  "I",   # isort
  "PGH", # pygrep-hooks
  "PT",  # flake8-pytest-style
  "RET", # flake8-return
  "S",   # flake8-bandit
  "SIM", # flake8-simplify
  "UP",  # pyupgrade
  "W",   # pycodestyle warnings
]
lint.ignore = [ "D1" ]
lint.per-file-ignores."*/migrations/*.py" = [ "E501" ]
lint.per-file-ignores."*/test*.py" = [ "PLR2004", "S101" ]
lint.flake8-pytest-style.fixture-parentheses = false
lint.flake8-pytest-style.mark-parentheses = false
lint.isort.combine-as-imports = true
lint.isort.force-wrap-aliases = true
lint.isort.known-first-party = [ "mailauth", "tests" ]
lint.isort.section-order = [ "future", "standard-library", "third-party", "first-party", "local-folder" ]
lint.isort.split-on-trailing-comma = true
lint.pydocstyle.convention = "pep257"

[tool.pytest]
ini_options.minversion = "6.0"
ini_options.testpaths = [ "tests" ]
ini_options.addopts = "--cov --cov-report=xml --cov-report=term --tb=short -rxs"
ini_options.DJANGO_SETTINGS_MODULE = "tests.testapp.settings"

[tool.coverage]
run.source = [ "mailauth" ]
report.skip_covered = true
report.show_missing = true
